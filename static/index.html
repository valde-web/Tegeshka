    <style>
        :root {
            --bg-color: #131320;
            --card-bg: #252525;
            --text-color: #e9e9e9;
            --accent-color: #2D3E50;
            --accent-hover: #364b60;
            --border-radius: 12px;
            --error-color: #ff5252;
            --success-color: #3d8c40;
        }

        body, html {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100%;
            padding: 0;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: var(--border-radius);
            border: 1px solid #444;
            background: #1a1a1a;
            color: var(--text-color);
            box-sizing: border-box;
            transition: border 0.3s;
            font-size: 1.0em;
            caret-color: var(--text-color);
        }

        textarea:focus, input:focus { 
            outline: none; 
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            color: var(--text-color);
        }

        h3 { margin-top: 0; color: var(--text-color); font-weight: 500; }

        input:-webkit-autofill {
        -webkit-box-shadow: 0 0 0px 1000px #1a1a1a inset !important;
        box-shadow: 0 0 0px 1000px #1a1a1a inset !important;
        -webkit-text-fill-color: var(--text-color) !important;
        font-size: 1em;
        }

        button {
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 1.1em;
            padding: 10px 18px;
            border-radius: var(--border-radius);
            border: none;
            background: var(--accent-color);
            color: var(--text-color);
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        #info {
            font-size: 1.0em;
            min-height: 1.2em;
        }

        .file-link {
            display: block;
            margin-top: 5px;
            color: #460046;
            text-decoration: none;
            font-size: 0.9em;
        }

        .controls-row { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }

        #send {
        background: none;
        padding: 10px 10px !important;
        border-radius: 100px;

        }

        #attachBtn {
        background: none;
        padding: 10px 10px !important;
        border-radius: 100px;
        }

        #videoBtn, #voiceBtn {
        background: none;
        padding: 10px 10px !important;
        border-radius: 100px;
        }

        position: relative;
        top: 2px;
        }

        .row { display:flex; align-items:flex-start; }

        .file-input-wrapper { flex-grow: 1; }

        ::placeholder {
        color: #a6a6a6;
        font-size: 1.0em;

/* Контейнер голосового сообщения */
.voice-player {
    display: flex;
    align-items: center;
    background: #2c2c2c;
    border-radius: 20px;
    padding: 8px 15px;
    gap: 10px;
    min-width: 200px;
    margin-top: 10px;
}
.play-btn {
    background: #00afff;
    border: none;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.voice-progress {
    flex-grow: 1;
    height: 4px;
    background: #444;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
}
.voice-progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: #00afff;
}

/* Контейнер видео-кружка */
.video-circle-container {
    position: relative;
    width: 200px;
    height: 200px;
    margin-top: 10px;
    cursor: pointer;
    transition: transform 0.3s ease;
}
.video-circle-container:active {
    transform: scale(1.1); /* Увеличение при нажатии */
}
.video-circle-node {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: #000;
    mask-image: radial-gradient(circle, white 100%, black 100%); /* Идеальный круг */
    -webkit-mask-image: -webkit-radial-gradient(circle, white 100%, black 100%);
}
/* Круговая шкала (SVG) */
.video-progress-svg {
    position: absolute;
    top: -5px; left: -5px;
    width: 210px; height: 210px;
    transform: rotate(-90deg); /* Чтобы шкала шла с 12 часов */
    pointer-events: none;
}
.video-progress-circle {
    fill: none;
    stroke: #00afff;
    stroke-width: 3;
    stroke-dasharray: 628; /* Длина окружности (2 * pi * 100) */
    stroke-dashoffset: 628;
    transition: stroke-dashoffset 0.1s linear;
}

/* Основная обертка */
.messenger-wrapper { display: flex; height: 100vh; width: 100vw; }

/* Сайдбар */
.sidebar { width: 350px; background: #17212b; border-right: 1px solid #111; display: flex; flex-direction: column; }
.sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #17212b; }
.sidebar-search { padding: 10px; }
.sidebar-search input { width: 100%; background: #242f3d; border: 1px solid #111; padding: 10px; border-radius: 8px; color: white; box-sizing: border-box; }

.chats-list { flex-grow: 1; overflow-y: auto; }
.chat-item { padding: 12px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
.chat-item:hover { background: #202b36; }
.chat-item.active { background: #2b5278; }

/* Аватарки */
.avatar-sm { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #2c3b4a; }

/* Правая часть (чат) */
.chat-main { flex-grow: 1; display: flex; flex-direction: column; background: #0e1621; background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); }
.chat-header { padding: 10px 20px; background: #17212b; border-bottom: 1px solid #111; display: flex; align-items: center; }
.chat-info { display: flex; align-items: center; gap: 12px; }

/* Поле ввода */
.input-area { padding: 10px 20px 20px 20px; color: var(--text-color); caret-color: var(--text-color); border-radius: var(--border-radius); border: 1px solid #444; background: #1a1a1a; box-sizing: border-box; transition: border 0.3s; font-size: 1.0em; }
textarea { flex-grow: 1; background: transparent; color: var(--text-color); caret-color: var(--text-color); resize: none; font-size: 1em; outline: none; max-height: 200px; padding: 10px 0; border-radius: var(--border-radius); border: 1px solid #444; background: #1a1a1a; box-sizing: border-box; transition: border 0.3s; font-size: 1.0em; }
#text { flex-grow: 1; width: 100%; margin: 0; border: none; color: var(--text-color); caret-color: var(--text-color); resize: none; outline: none; border-radius: var(--border-radius); background: #1a1a1a; box-sizing: border-box; font-size: 1.0em; }
.button-grid { display: grid; grid-template-columns: repeat(4, 40px); gap: 5px; }
.button-grid button { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
.button-grid button:hover { background: #242f3d; }

/* Кнопка выхода */
.icon-btn { background: none; border: none; color: #888; font-size: 1.2em; cursor: pointer; }

/* Сообщения (адаптация старых стилей под новую ширину) */
.msg-wrapper { max-width: 80%; display: flex; margin-bottom: 5px; }
.msg-wrapper.my { align-self: flex-end; }
.msg-wrapper.other { align-self: flex-start; }
.msg {
    background: #3d3d3d;
    padding: 8px 12px;
    border-radius: 15px;
    max-width: 80%;
    align-self: flex-start;
    word-wrap: break-word;
    white-space: pre-wrap;
}

/* Стиль самого облачка (рамки) */
.msg-bubble {
    max-width: 100%;
    padding: 8px 12px;
    border-radius: 12px;
    position: relative;
    word-wrap: break-word;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

/* Цвета облачков */
.my .msg-bubble {
    background: #242424; /* Темно-зеленый (как в WhatsApp) */
    color: var(--text-color);
    border-bottom-right-radius: 2px;
}

.other .msg-bubble {
    background: #2c1313; /* Темно-серый */
    color: var(--text-color);
    border-bottom-left-radius: 2px;
}

/* Имя отправителя над текстом */
.msg-name {
    display: block;
    font-size: 1em;
    font-weight: bold;
    margin-bottom: 4px;
    color: #9f84ff; /* Матричный зеленый */
}

.chat-item {
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    border-bottom: 1px solid #111;
    transition: 0.2s;
}
.chat-item:hover { background: #242f3d; }
.chat-item .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2c3b4a; }

/* Окно звонка */
#call-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(14, 22, 33, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    color: white;
}

.video-container {
    position: relative;
    width: 80%;
    max-width: 900px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
}

#remote-video { width: 100%; height: 100%; object-fit: cover; }
#local-video { 
    position: absolute; 
    top: 20px; right: 20px; 
    width: 200px; border-radius: 10px; 
    border: 2px solid #2b5278;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.call-controls {
    margin-top: 20px;
    display: flex;
    gap: 20px;
}

.call-btn {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}

.btn-mute { background: #242f3d; }
.btn-camera { background: #242f3d; }
.btn-screen { background: #242f3d; }
.btn-hangup { background: #e53935; } /* Красная кнопка сброса */

.call-btn:hover { transform: scale(1.1); opacity: 0.8; }
.call-btn.active { background: #2b5278; }

#incoming-call-modal {
    position: fixed;
    top: 20px; right: 20px;
    background: #17212b;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    display: none;
    z-index: 10000;
    border: 1px solid #2b5278;
}

        /* Ползунок (thumb) */

async function initPush() {
    try {
        if (!messaging) return;

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        const fcmToken = await messaging.getToken({ 
            vapidKey: 'BDOBdZu25D4B4-ecqVfJHhCUBb1kJiSAOKHRLuqBnD6es-twABw0-ILG9K9DU31EteGaRcNI8azBfqEAeJ7yM4Q' 
        });
        
        const accessToken = localStorage.getItem('accesstoken');

        // ПРОВЕРКА: Если токена нет или он "сломан", не отправляем
        if (!accessToken || accessToken.split('.').length < 3) {
            console.warn("initPush: Отмена, accessToken отсутствует или некорректен");
            return;
        }

        if (fcmToken) {
            await fetch('/update-fcm-token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + accessToken
                },
                body: JSON.stringify({ fcm_token: fcmToken })
            });
            console.log("Push-уведомления настроены!");
        }
    } catch (error) {
        console.error("Ошибка при настройке пушей:", error);
    }
}

function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"')
        .replace(/'/g, "'");
}

function escapeAttr(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/"/g, '"').replace(/'/g, "'");
}

window.connectWS = function(roomNameFromParam = null) {  
    console.log("Вызов функции connectWS для комнаты:", roomNameFromParam);
    const tokenValue = localStorage.getItem('accesstoken');

    if (!tokenValue || tokenValue === 'null') {
        showChatInfo('Нет токена — войдите в систему', 'error');
        return;
    }

    let roomName = roomNameFromParam;
    if (!roomName) {
        const roomInput = document.getElementById('room');
        roomName = roomInput ? (roomInput.value || '1') : '1';
    }
    const proto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
    const base = proto + '//' + location.host;
    const wsUrl = base + '/ws/' + encodeURIComponent(roomName) + '?token=' + encodeURIComponent(tokenValue);

    if (window.ws) {
        // Если мы уже подключены именно к ЭТОЙ комнате — ничего не делаем
        if (window.ws.url.includes('/ws/' + encodeURIComponent(roomName))) {
            console.log("Уже подключены к комнате:", roomName);
            updateCallButton(); 
            return;
        } 
        // Если мы подключены к ДРУГОЙ комнате — закрываем старую
        console.log("Смена чата: закрываем старое соединение...");
        window.ws.close(1000, "Переключение комнаты"); 
        window.ws = null; // Обнуляем после закрытия
        stopAllTracks(); 
    }

    try {
        console.log("Попытка подключения к WebSocket:", wsUrl);
        window.ws = new WebSocket(wsUrl); // Присваиваем глобальной переменной
    } catch (err) {
        console.error('WS init error', err);
        showChatInfo('Не удалось создать WebSocket', 'error');
        return;
    }

    window.ws.onopen = () => {
        console.log("WebSocket успешно открыт для комнаты:", roomName);
        updateCallButton(); 
    };

    window.ws.onmessage = (ev) => {
        try {
            const data = JSON.parse(ev.data);
            const myId = localStorage.getItem('myId');
            console.log("Получены данные из WS:", data);

            if (String(data.sender_id) === String(myId)) {
                return; 
            }

            // 1. Если это сигнал звонка
            if (data.type === 'call_signal' || data.type === 'rtc-signal') {
                if (typeof handleCallSignal === 'function') handleCallSignal(data);
                return;
            }

            // 2. Если это обычное сообщение
            // Проверяем, что это объект сообщения (есть текст или файл)
            if (data.sender_id || data.text || data.file_url) {
                // Звуковое уведомление
                const isMe = String(data.sender_id) === String(myId);
                if (!isMe) {
                const audioNotify = new Audio('/static/zvukTG.mp3');
                audioNotify.volume = 0.5;
                audioNotify.play().catch(e => console.log("Звук заблокирован"));
                
                if (typeof window.renderMessage === 'function') {
                    window.renderMessage(data);
                }
            } else {
                // window.renderMessage(data); // Раскомментируй, если оптимистичная отрисовка не нужна
            }
        }
    } catch (e) {
        console.error("Ошибка при обработке сообщения WS:", e, ev.data);
    }
};

    window.ws.onclose = (ev) => {
        console.log("WS закрыт. Код:", ev.code);
        // Код 1000 - нормальное закрытие, 1005 - нет кода статуса (часто тоже нормальное)
        // Если это не эти коды, то это неожиданное закрытие (как 1006)
        if (ev.code !== 1000 && ev.code !== 1005) { 
            showChatInfo(`Соединение разорвано: Код ${ev.code}.`, 'error');
        } else {
            // showChatInfo('Соединение закрыто.', 'info'); // Не спамить
        }
        window.ws = null; // Важно: обнуляем глобальную переменную
        stopAllTracks(); 
        updateCallButton(); 
    };

    window.ws.onerror = (e) => {
        console.error('WS error', e);
        showChatInfo('Произошла ошибка WebSocket', 'error');
    };
};

async function doAuth(endpoint, isRegister = false) { 
    // Получаем элементы внутри функции, чтобы гарантировать их наличие
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const displayNameEl = document.getElementById('display_name');
    const infoEl = document.getElementById('info');
    
    const username = usernameEl ? usernameEl.value.trim() : '';
    const password = passwordEl ? passwordEl.value : '';
    const displayName = (isRegister && displayNameEl) ? displayNameEl.value.trim() : '';
    
    if (!username || !password || (isRegister && !displayName)) { 
        if (infoEl) infoEl.innerText = '❌ Заполните все поля';
        return; 
    }

    const fd = new FormData();
    fd.append('username', username);
    fd.append('password', password);
    if (isRegister) fd.append('display_name', displayName);

    try {
        const res = await fetch(endpoint, {
            method: 'POST',
            body: fd
        });

        // ЧИТАЕМ JSON ТОЛЬКО ОДИН РАЗ
        const data = await res.json().catch(() => null);

        if (!res.ok) {
            const errMsg = data?.detail || `Ошибка: ${res.status}`;
            if (infoEl) infoEl.innerText = '❌ ' + errMsg;
            return;
        }

        // Извлекаем данные из ответа (проверяем разные варианты ключей)
        const token = data?.accesstoken || data?.access_token || data?.token;
        const userId = data?.userid || data?.user_id || data?.id;
        const dispName = data?.display_name || displayName || username;
        
        if (!token || !userId) {
            if (infoEl) infoEl.innerText = '❌ Сервер не прислал токен или ID';
            console.error("Data error:", data);
            return;
        }

        // 1. Сохраняем данные в localStorage
        localStorage.setItem('accesstoken', token);
        localStorage.setItem('myId', userId);
        localStorage.setItem('myDisplayName', data.display_name);

        // 2. Обновляем интерфейс (скрываем вход, показываем чат)
        const authLayout = document.getElementById('auth-layout');
        const mainLayout = document.getElementById('main-layout');
        
        if (authLayout) authLayout.style.display = 'none';
        if (mainLayout) mainLayout.style.display = 'block';

        // Отображаем имя в сайдбаре
        const nameDisplay = document.getElementById('myDisplayNameDisplay');
        if (nameDisplay) nameDisplay.innerText = data.display_name;

        console.log('✅ Авторизация успешна, ID:', userId);

        // 3. Запускаем остальные процессы
        if (typeof validateTokenAndUpdateUI === 'function') {
            validateTokenAndUpdateUI();
        }
        
        if (typeof initPush === 'function') {
            // Задержка 500мс, чтобы токен точно успел записаться в память браузера
            setTimeout(() => initPush(), 500);
        }

        if (typeof showOnlyChat === 'function') {
            showOnlyChat();
        }

        if (typeof loadMyChats === 'function') {
            await loadMyChats(); 
        } else {
            console.warn("Функция loadMyChats не найдена!");
        }
        window.loadMyChats(); 
    } catch (err) {
        console.error('Auth error:', err);
        if (infoEl) infoEl.innerText = '❌ Ошибка соединения с сервером';
    }
}

window.renderMessage = function(j) {
    try {
        const myId = localStorage.getItem('myId');
        const isMe = String(j.sender_id) === String(myId);
        const side = isMe ? 'my' : 'other';
        const name = j.display_name || j.username || 'Аноним';
        const fileUrl = j.file_url || j.file_path || null;
        
        let messageText = j.text || '';
        let fileHtml = '';

        // Определение типа контента (твоя логика)
        const isVoice = messageText === '__voice__';
        const isVideo = messageText === '__video__';

        if (fileUrl) {
            const urlLower = fileUrl.toLowerCase();
            const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(urlLower);

            if (isVoice) {
                messageText = '';
                fileHtml = `
                <div class="voice-player">
                    <button class="play-btn" type="button" onclick="toggleAudio(this)">▶</button>
                    <audio src="${fileUrl}" preload="metadata"></audio>
                    <div class="voice-progress"><div class="voice-progress-fill"></div></div>
                    <small class="duration" style="color:#aaa; font-size:10px; margin-left:5px;">0:00</small>
                </div>`;
            } else if (isVideo) {
                messageText = '';
                fileHtml = `
                <div class="video-circle-container" onclick="toggleVideo(this)">
                    <video class="video-circle-node" src="${fileUrl}" playsinline preload="metadata"></video>
                    <svg class="video-progress-svg">
                        <circle class="video-progress-circle" cx="105" cy="105" r="100"></circle>
                    </svg>
                </div>`;
            } else if (isImage) {
                fileHtml = `<img src="${fileUrl}" style="max-width: 300px; max-height: 300px; width: auto; height: auto; object-fit: contain; border-radius:8px; margin-top:8px; cursor:pointer;" onclick="window.open(this.src)">`;
            } else {
                let fileName = 'Файл';
                try {
                    fileName = decodeURIComponent(fileUrl.split('/').pop().split('?')[0]);
                } catch(e) {
                    fileName = fileUrl.split('/').pop();
                }
                fileHtml = `<a href="${fileUrl}" target="_blank" style="color:#00afff; text-decoration:none; display:flex; margin-top:8px;">
                <span style="font-size: 1.0em;">📁</span>
                <span style="color: #00afff; font-size: 1.0em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;" title="${fileName}">${fileName}</span></a>`;
            }
        }

        if (messageText === '__voice__' || messageText === '__video__') {
            messageText = ''; 
        }

        const html = `
            <span class="msg-name">${name}</span>
            ${messageText ? `<div class="msg-text" style="white-space: pre-wrap;">${messageText}</div>` : ''}
            ${fileHtml}
        `;
        if (typeof appendMessage === 'function') {
            appendMessage(html, side);
        }

        console.error("Ошибка отрисовки сообщения:", e);
    }

async function sendMessage() { 
    const tokenValue = localStorage.getItem('accesstoken');
    
    if (!window.ws || window.ws.readyState !== WebSocket.OPEN) {
        showChatInfo('Сначала подключитесь к чату!', 'error');
        if (window.ws && window.ws.readyState === WebSocket.CONNECTING) {
            showChatInfo('Соединение устанавливается, подождите...', 'info');
        }
        return;
    }

    // Определяем элементы (убедись, что ID совпадают с твоим HTML)
    const textEl = document.getElementById('text');
    const fileEl = document.getElementById('file');
    const fileNameEl = document.getElementById('file-name');
    const sendBtn = document.getElementById('send');

    let currentRoomName = '1'; // По умолчанию для общей комнаты
    if (ws && ws.url) {
        // Парсим room_id из URL WebSocket'а
        const urlParts = ws.url.split('/');
        // URL вида wss://host/ws/p2p_X_Y?token=...
        // Room_id будет частью urlParts[urlParts.length - 1] до знака '?'
        currentRoomName = urlParts[urlParts.length - 1].split('?')[0];
        currentRoomName = decodeURIComponent(currentRoomName); // Декодируем, если есть спецсимволы
    } else {
        // Fallback, если WS еще не инициализирован (хотя по идее сюда не должны попасть)
        const roomInput = document.getElementById('room');
        currentRoomName = roomInput ? (roomInput.value || '1') : '1';
    }

    const text = textEl ? textEl.value.trim() : '';
    let file_url = null;

    function clearFileSelection() {
        if (fileEl) fileEl.value = '';
        if (fileNameEl) fileNameEl.textContent = '';
    }

    // 2. Логика загрузки файла (оставляем как была, она рабочая)
    if (fileEl && fileEl.files && fileEl.files.length > 0) {
        if (!tokenValue) {
            showChatInfo('Требуется авторизация (отсутствует токен)', 'error');
            clearFileSelection();
            return;
        }
        const fd = new FormData();
        fd.append('file', fileEl.files[0]); 
        fd.append('token', tokenValue);
    if (!tokenValue) {
      showChatInfo('Требуется авторизация (отсутствует токен)', 'error');
      clearFileSelection();
      return;
    }

        if (sendBtn) sendBtn.disabled = true;
        showChatInfo('Загрузка файла...', 'info');

        try {
            const res = await fetch('/upload', {
                method: 'POST',
                body: fd
            });

        if (!res.ok) {
                const errorData = await res.json().catch(() => ({}));
                console.error("Детали ошибки от сервера:", errorData);
                throw new Error(errorData.detail || 'Ошибка сервера');
            }

            const parsed = await res.json();
            file_url = parsed.file_url || parsed.url || null;

        } catch (err) {
            console.error('Ошибка в fetch /upload:', err);
            showChatInfo('Ошибка при загрузке: ' + err.message, 'error');
            if (sendBtn) sendBtn.disabled = false;
            return; // Прекращаем отправку, если файл не загрузился
        } finally {
            if (sendBtn) sendBtn.disabled = false;
        }
    }

    // 3. Если нет ни текста, ни файла — выходим
    if (!text && !file_url) return;

    // 4. ОТПРАВКА В WEBSOCKET
    const payload = { 
        text: text, 
        file_url: file_url, 
        room: currentRoomName  
    };

    try {

// Функция загрузки записанного медиа (использует твою логику fetch /upload)
async function uploadAndSendMedia(blob, filename, type) {
    const tokenValue = localStorage.getItem('accesstoken');
    const myId = localStorage.getItem('myId');
    const myName = localStorage.getItem('myDisplayName') || 'Я';
    const localPreviewUrl = URL.createObjectURL(blob);
    const tempId = "temp_" + Date.now();

    if (typeof window.renderMessage === 'function') {
        window.renderMessage({
            sender_id: myId,
            display_name: myName,
            text: `__${type}__`,
            file_url: localPreviewUrl, // Используем локальную ссылку
            temp_id: tempId
        });
    }

    const fd = new FormData();
    fd.append('file', blob, filename);
    fd.append('token', tokenValue);

    try {
        const res = await fetch('/upload', { method: 'POST', body: fd });
        const parsed = await res.json();
        const server_file_url = parsed.file_url || parsed.url;
        
        // Получаем текущую комнату
        let room = '1';
        if (window.ws && window.ws.url) {
            const urlParts = window.ws.url.split('/');
            room = decodeURIComponent(urlParts[urlParts.length - 1].split('?')[0]);
        }

        // 2. ОТПРАВКА НА СЕРВЕР
        if (window.ws && window.ws.readyState === WebSocket.OPEN) {
            window.ws.send(JSON.stringify({ 
                text: `__${type}__`, 
                file_url: server_file_url, 
                room: room 
            }));
        }
        
        // После успешной отправки можно "пометить" сообщение как отправленное (убрать прозрачность и т.д.)
        const tempBubble = document.getElementById('msg-' + tempId);
        if (tempBubble) tempBubble.style.opacity = "1";

    } catch (err) {
        console.error("Ошибка загрузки медиа:", err);
        // Если ошибка — удаляем временный пузырек
        const tempBubble = document.getElementById('msg-' + tempId);
        if (tempBubble) tempBubble.remove();
        alert("Не удалось отправить файл");
    }
}

window.toggleAudio = function(btn) {
    // Находим аудио внутри того же родителя, где кнопка
    const audio = btn.parentElement.querySelector('audio');
    const fill = btn.parentElement.querySelector('.voice-progress-fill');
    const durLabel = btn.parentElement.querySelector('.duration');

    if (!audio) return;

    if (audio.paused) {
        // Останавливаем все остальные аудио в чате (как в Telegram)
        document.querySelectorAll('audio').forEach(a => { if(a !== audio) a.pause(); });

        const playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                btn.innerText = '⏸';
            }).catch(error => {
                console.log("Воспроизведение прервано:", error);
            });
        }

        audio.ontimeupdate = () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            if (fill) fill.style.width = progress + '%';
            
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            if (durLabel) durLabel.innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`;
        };
        audio.onended = () => { btn.innerText = '▶'; if(fill) fill.style.width = '0%'; };
    } else {
        audio.pause();
        btn.innerText = '▶';
    }
};

window.toggleVideo = function(container) {
    const video = container.querySelector('video');
    const circle = container.querySelector('.video-progress-circle');
    const totalLength = 628; 

    if (!video) return;

    if (video.paused) {
        // Останавливаем все остальные видео
        document.querySelectorAll('video').forEach(v => { if(v !== video) v.pause(); });

        const playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => { console.log("Видео прервано:", error); });
        }

        video.ontimeupdate = () => {
            const progress = video.currentTime / video.duration;
            const offset = totalLength - (progress * totalLength);
            if (circle) circle.style.strokeDashoffset = offset;
        };
        video.onended = () => { if (circle) circle.style.strokeDashoffset = totalLength; };
    } else {
        video.pause();
    }
};

window.searchUsers = async function() {
    const input = document.getElementById('userSearchInput');
    const query = input ? input.value.trim() : '';
    const list = document.getElementById('chatsList');
    const chatsList = document.getElementById('chatsList');
    const searchResults = document.getElementById('searchResults');

    if (query.length === 0) {
        searchResults.innerHTML = '';
        searchResults.style.display = 'none';
        chatsList.style.display = 'block';
        return;
    }

    // Если ищем — прячем старые чаты, показываем результаты
    chatsList.style.display = 'none';
    searchResults.style.display = 'block';
    searchResults.innerHTML = '<div style="padding:10px; color:#888;">Поиск...</div>';

    try {
        // ОБРАТИ ВНИМАНИЕ: Тут используются обратные кавычки ` `
        const res = await fetch(`/users/search?query=${encodeURIComponent(query)}`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('accesstoken') }
        });
        
        const users = await res.json();
        
        searchResults.innerHTML = '';
        if (users.length === 0) {
            searchResults.innerHTML = '<div style="padding:10px; color:#888;">Никто не найден</div>';
            return;
        }

        users.forEach(u => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.style = "padding:12px; border-bottom:1px solid #111; cursor:pointer;";
            div.innerHTML = `<strong>${u.display_name || u.username}</strong><br><small style="color:#888;">@${u.username}</small>`;
            
            div.onclick = () => {
                window.selectUser(u.id, u.display_name || u.username);
                // Очищаем поиск после выбора
                input.value = '';
                searchResults.style.display = 'none';
                chatsList.style.display = 'block';
                window.loadMyChats(); // Обновляем список чатов
            };
            searchResults.appendChild(div);
        });
    } catch (err) {
        console.error("Search error:", err);
    }
};

async function initiateCall() {
    console.log("Начинаем звонок...");
    const roomInput = document.getElementById('room');
    const currentRoom = roomInput ? roomInput.value : null;

    if (!window.ws || window.ws.readyState !== WebSocket.OPEN) {
        alert("Нет соединения с сервером. Попробуйте обновить страницу.");
        return;
    }

    if (!currentRoom || !currentRoom.startsWith('p2p_')) {
        alert("Звонки доступны только в личных чатах.");
        return;
    }

    document.getElementById('call-overlay').style.display = 'flex';
    document.getElementById('call-status').innerText = "Вызов собеседника...";

    try {
        window.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = window.localStream;

        // Отправляем запрос на звонок
        window.ws.send(JSON.stringify({
            type: 'call_signal',
            subtype: 'offer_request',
            room: currentRoom
        }));
        console.log("Сигнал offer_request отправлен в комнату:", currentRoom);
    } catch (err) {
        console.error("Ошибка камеры:", err);
        alert("Не удалось получить доступ к камере.");
        stopAllTracks();
    }
}

window.handleCallSignal = async function(data) {
    console.log("Обработка сигнала звонка:", data.subtype);
    
    switch (data.subtype) {
        case 'offer_request':
            console.log("ВХОДЯЩИЙ ВЫЗОВ!");
            const modal = document.getElementById('incoming-call-modal');
            if (modal) {
                modal.style.display = 'block';
                // Вибросигнал или звук вызова можно добавить тут
            }
            window.incomingCallData = data;
            break;
            
        case 'webrtc_offer':
            if (!window.peerConnection) createPeerConnection();
            document.getElementById('call-overlay').style.display = 'flex';
            await window.peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await window.peerConnection.createAnswer();
            await window.peerConnection.setLocalDescription(answer);
            window.ws.send(JSON.stringify({
                type: 'call_signal', subtype: 'webrtc_answer',
                answer: answer, room: data.room
            }));
            break;

        case 'webrtc_answer':
            if (window.peerConnection) {
                await window.peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                document.getElementById('call-status').innerText = "В разговоре";
            }
            break;

        case 'ice_candidate':
            if (window.peerConnection && data.candidate) {
                await window.peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
            break;

        case 'hangup':
            stopAllTracks();
            break;
    }
};

async function acceptCall() {
    document.getElementById('incoming-call-modal').style.display = 'none';
    document.getElementById('call-overlay').style.display = 'flex';

    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;

        createPeerConnection();
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        window.ws.send(JSON.stringify({
            type: 'call_signal', subtype: 'webrtc_offer',
            offer: offer, room: window.incomingCallData.room
        }));
        document.getElementById('call-status').innerText = "В разговоре";
    } catch (err) {
        showChatInfo("Ошибка при ответе на звонок", "error");
        stopAllTracks();
    }
}

function rejectCall() {
    document.getElementById('incoming-call-modal').style.display = 'none';
    if (window.ws && window.incomingCallData) {
        window.ws.send(JSON.stringify({
            type: 'call_signal', subtype: 'hangup',
            room: window.incomingCallData.room
        }));
    }
}

function createPeerConnection() {
    peerConnection = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    
    if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    }

    peerConnection.onicecandidate = (event) => {
        if (event.candidate && window.ws) {
            window.ws.send(JSON.stringify({
                type: 'call_signal', subtype: 'ice_candidate',
                candidate: event.candidate, room: document.getElementById('room').value
            }));
        }
    };

    peerConnection.ontrack = (event) => {
        document.getElementById('remote-video').srcObject = event.streams[0];
    };
}

async function toggleScreenShare() {
    if (!localStream || !peerConnection) {
        console.warn("Невозможно начать демонстрацию экрана: звонок не активен.");
        showChatInfo("Невозможно начать демонстрацию экрана: звонок не активен.", 'error');
        return;
    }

    try {
        if (!isScreenSharing) {
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }); // Включаем аудио для демонстрации
            const videoTrack = screenStream.getVideoTracks()[0];
            const audioTrack = screenStream.getAudioTracks()[0]; // Аудио с экрана
            
            const videoSender = peerConnection.getSenders().find(s => s.track.kind === 'video');
            const audioSender = peerConnection.getSenders().find(s => s.track.kind === 'audio' && s.track.label !== localStream.getAudioTracks()[0].label); // Ищем отправителя аудио для экрана
            
            if (videoSender) {
                await videoSender.replaceTrack(videoTrack);
                if (audioTrack) { // Если есть аудио с экрана, заменяем наш микрофон на него
                    if (audioSender) {
                        await audioSender.replaceTrack(audioTrack);
                    } else { // Если отправителя аудио с экрана еще нет, добавляем его
                        peerConnection.addTrack(audioTrack, screenStream);
                    }
                }
                
                document.getElementById('local-video').srcObject = screenStream;
                isScreenSharing = true;
                document.querySelector('.btn-screen').classList.add('active');
                showChatInfo('Демонстрация экрана началась.', 'info');
                
                videoTrack.onended = () => {
                    if (isScreenSharing) toggleScreenShare(); 
                };
            } else {
                 console.error("Не найден видео отправитель для замены.");
                 screenStream.getTracks().forEach(track => track.stop());
            }
        } else {
            // Возвращаемся к камере и микрофону
            const mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const videoTrack = mediaStream.getVideoTracks()[0];
            const audioTrack = mediaStream.getAudioTracks()[0]; // Наш микрофон

            const videoSender = peerConnection.getSenders().find(s => s.track.kind === 'video');
            const audioSender = peerConnection.getSenders().find(s => s.track.kind === 'audio'); // Наш микрофон
            
            if (videoSender) {
                await videoSender.replaceTrack(videoTrack);
                if (audioSender) await audioSender.replaceTrack(audioTrack); // Заменяем аудио на микрофон
                
                document.getElementById('local-video').srcObject = mediaStream;
                isScreenSharing = false;
                document.querySelector('.btn-screen').classList.remove('active');
                showChatInfo('Демонстрация экрана завершена, возвращаемся к камере.', 'info');
            } else {
                console.error("Не найден видео отправитель для замены (возврат к камере).");
                mediaStream.getTracks().forEach(track => track.stop());
            }
        }
    } catch (err) {
        console.error("Ошибка при демонстрации экрана:", err);
        showChatInfo('Ошибка при демонстрации экрана: ' + err.message, 'error');
        if (isScreenSharing) isScreenSharing = false;
        document.querySelector('.btn-screen').classList.remove('active');
    }
}

function hangup() {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            type: 'call_signal', subtype: 'hangup',
            room: document.getElementById('room').value
        }));
    }
    showChatInfo('Вы завершили звонок.', 'info');
    stopAllTracks();
}

function stopAllTracks() {
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }
    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }
    document.getElementById('call-overlay').style.display = 'none';
    document.getElementById('incoming-call-modal').style.display = 'none';
    isScreenSharing = false;
    // Сброс состояния кнопок
    document.querySelector('.btn-mute')?.classList.remove('active');
    document.querySelector('.btn-camera')?.classList.remove('active');
    document.querySelector('.btn-screen')?.classList.remove('active');
    // Очистка видеопотоков на элементах
    document.getElementById('local-video').srcObject = null;
    document.getElementById('remote-video').srcObject = null;
}
