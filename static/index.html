/* Контейнер видео-кружка */
.video-circle-container {
    position: relative;
    width: 200px;
    height: 200px;
    margin-top: 10px;
    cursor: pointer;
    transition: transform 0.3s ease;
}
.video-circle-container:active {
    transform: scale(1.1); /* Увеличение при нажатии */
}
.video-circle-node {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: #000;
    mask-image: radial-gradient(circle, white 100%, black 100%); /* Идеальный круг */
    -webkit-mask-image: -webkit-radial-gradient(circle, white 100%, black 100%);
}
/* Круговая шкала (SVG) */
.video-progress-svg {
    position: absolute;
    top: -5px; left: -5px;
    width: 210px; height: 210px;
    transform: rotate(-90deg); /* Чтобы шкала шла с 12 часов */
    pointer-events: none;
}
.video-progress-circle {
    fill: none;
    stroke: #00afff;
    stroke-width: 3;
    stroke-dasharray: 628; /* Длина окружности (2 * pi * 100) */
    stroke-dashoffset: 628;
    transition: stroke-dashoffset 0.1s linear;
}

function validateTokenAndUpdateUI() {
    const token = localStorage.getItem('accesstoken');
    
    if (token && token !== 'null' && token !== 'undefined') {
        // Если токен есть — показываем чат
        showOnlyChat();
    } else {
        // Если токена нет — показываем вход
        showOnlyAuth();
    }
}

// 2. Функция: Показать только ЧАТ
function showOnlyChat() {
    const authSection = document.getElementById('auth-section'); // ID твоего блока входа
    const chatCard = document.getElementById('chat-card'); // ID твоего блока чата
    
    if (authSection) authSection.style.display = 'none';
    if (chatCard) chatCard.style.display = 'block';
}

// 3. Функция: Показать только ВХОД
function showOnlyAuth() {
    const authSection = document.getElementById('auth-section');
    const chatCard = document.getElementById('chat-card');
    
    if (authSection) authSection.style.display = 'block';

function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"')
        .replace(/'/g, "'");
}

function escapeAttr(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/"/g, '"').replace(/'/g, "'");
}

async function doAuth(endpoint, isRegister = false) { 
    // Убедись, что переменные usernameEl и passwordEl доступны здесь
    const username = usernameEl ? usernameEl.value.trim() : '';
    const password = passwordEl ? passwordEl.value : '';
    const displayName = isRegister && displayNameEl ? displayNameEl.value.trim() : '';
    const infoEl = document.getElementById('info');
    
    if (!username || !password || (isRegister && !displayName)) { 
        showAuthInfo(isRegister ? 'Введите логин, пароль и отображаемое имя' : 'Введите логин и пароль', 'error');
        return; 
    }

        // ИСПОЛЬЗУЕМ FormData, так как сервер ждет Form(...)
        const fd = new FormData();
        fd.append('username', username);
        fd.append('password', password);
        if (isRegister) fd.append('display_name', displayName);

    try {
        const res = await fetch(endpoint, {
            method: 'POST',
            body: fd
        });

        const data = await res.json().catch(() => null);

        if (!res.ok) {
            const errMsg = data?.detail || 'Ошибка сервера';
            if (infoEl) infoEl.innerText = '❌ ' + errMsg;
            return;
        }

        const contentType = res.headers.get('content-type');
        if (contentType && contentType.includes('application/json')) {
            data = await res.json();
        } else {
            // Если не JSON, пытаемся получить как текст
            data = await res.text();
            console.warn("Не-JSON ответ от сервера:", data);
        }

        if (!res.ok) {
            // Обрабатываем ошибку
            let errMsg = `HTTP ${res.status}`;
            if (data && typeof data === 'object' && data.detail) {
                errMsg = data.detail;
            } else if (data && typeof data === 'string') {
                errMsg = data; // Если ответ просто текст
            } else if (data) {
                errMsg = JSON.stringify(data); // Пытаемся показать объект
            } else {
                 errMsg = `HTTP ${res.status}`;
            }
            if (infoEl) infoEl.innerText = '❌ ' + errMsg;
            return;
        }

        // Сервер теперь возвращает ключ 'accesstoken' (мы это правили в main.py)
        const token = data && (data.accesstoken || data.token || data.access_token);
        const userId = data && (data.userid || data.user_id || data.id);
        const dispName = data.display_name || displayName || username;
        
        if (!token || !userId) {
            if (infoEl) infoEl.innerText = 'Сервер не прислал токен или ID';
            return;
        }

        localStorage.setItem('accesstoken', token);
        localStorage.setItem('myId', userId);
        localStorage.setItem('myDisplayName', dispName);

        // 3. Обновляем интерфейс
        document.getElementById('auth-layout').style.display = 'none';
        document.getElementById('main-layout').style.display = 'block';

        const nameDisplay = document.getElementById('myDisplayNameDisplay');
        if (nameDisplay) nameDisplay.innerText = dispName;

        // 4. Запускаем остальные процессы (теперь токен точно есть в памяти)
        if (typeof initPush === 'function') initPush();
        if (typeof validateTokenAndUpdateUI === 'function') validateTokenAndUpdateUI();
        
        console.log('✅ Авторизация успешна, ID:', userId);

        // Сохраняем токен под именем 'accesstoken' для синхронизации с другими частями кода
        localStorage.setItem('accesstoken', token);
        localStorage.setItem('myId', userId);
        
        // if (infoEl) infoEl.innerText = '✅ Успешно';
        if (typeof showOnlyChat === 'function') showOnlyChat(); 
        if (typeof validateTokenAndUpdateUI === 'function') validateTokenAndUpdateUI();
        if (typeof showChatInfo === 'function') {
            // showChatInfo('Вход выполнен. Подключитесь к чату.', 'success');
        }
        
        validateTokenAndUpdateUI();

    } catch (err) {
        console.error('Auth error:', err);
        if (infoEl) infoEl.innerText = '❌ Ошибка соединения с сервером';
    }
    initPush()
}

function connectWS() { 
    // ВСЕГДА берем свежий токен из памяти при подключении
    tokenValue = localStorage.getItem('accesstoken');

    if (!tokenValue || tokenValue === 'null') {
    showChatInfo('Нет токена — войдите в систему', 'error');
    return;
}

const proto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
const base = proto + '//' + location.host;

const roomName = (typeof roomEl !== 'undefined' && roomEl) ? (roomEl.value || '1') : '1';
const wsUrl = base + '/ws/' + encodeURIComponent(roomName) + '?token=' + encodeURIComponent(tokenValue);

if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    showChatInfo('Вы уже в чате, чтобы войти в другой, выйдите из аккаунта и зайдите заново', 'info');
    return;
}

try {
    ws = new WebSocket(wsUrl);
} catch (err) {
    console.error('WS init error', err);
    showChatInfo('Не удалось создать WebSocket', 'error');
    return;
}

ws.addEventListener('open', () => {
    appendMessage('Вы вошли в чат', 'system');
});

ws.onmessage = (ev) => {
    try {
        const j = JSON.parse(ev.data);
        
        // Проверяем, что это сообщение
        if (j.sender_id || j.text || j.file_url) {
            const myId = localStorage.getItem('myId');
            const isMe = String(j.sender_id) === String(myId);
            if (!isMe) {
                // Используй свой путь к файлу или этот стандартный звук
                const audioNotify = new Audio('/static/zvukTG.mp3');
                audioNotify.volume = 0.5; // Громкость 50%
                audioNotify.play().catch(e => console.log("Звук заблокирован браузером до первого клика"));
            }
            const side = isMe ? 'my' : 'other';
            const name = j.display_name || 'Аноним';
            
            let messageText = j.text || '';
            let fileHtml = '';

            // Определение типа контента
            const isVoice = messageText === '__voice__';
            const isVideo = messageText === '__video__';

            if (j.file_url) {
                const url = j.file_url.toLowerCase();
                const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(url);

                if (isVoice) {
                    messageText = 'Голосовое сообщение';
                    fileHtml = `
                    <div class="voice-player">
                        <button class="play-btn" type="button" onclick="toggleAudio(this)">▶</button>
                        <!-- Аудио тег уже здесь -->
                        <audio src="${j.file_url}" preload="metadata"></audio>
                        <div class="voice-progress"><div class="voice-progress-fill"></div></div>
                        <small class="duration" style="color:#aaa; font-size:10px; margin-left:5px;">0:00</small>
                    </div>`;
                } else if (isVideo) {
                    messageText = 'Видеосообщение';
                    fileHtml = `
                    <div class="video-circle-container" onclick="toggleVideo(this)">
                        <video class="video-circle-node" src="${j.file_url}" playsinline preload="metadata"></video>
                        <svg class="video-progress-svg">
                            <circle class="video-progress-circle" cx="105" cy="105" r="100"></circle>
                        </svg>
                    </div>`;
                } else if (isImage) {
                    fileHtml = `<img src="${j.file_url}" style="max-width:100%; border-radius:8px; margin-top:8px; cursor:pointer;" onclick="window.open(this.src)">`;
                } 
                else {
                    fileHtml = `<a href="${j.file_url}" target="_blank" style="color:#00afff; text-decoration:none; display:block; margin-top:8px;">📁 ${j.file_url.split('/').pop()}</a>`;
                }
            }

            // Сборка сообщения
            const html = `
                <span class="msg-name">${name}</span>
                ${messageText ? `<div class="msg-text" style="white-space: pre-wrap;">${messageText}</div>` : ''}
                ${fileHtml}
            `;

            // Вызываем функцию добавления в чат
            appendMessage(html, side);
            return;
        }
    } catch (e) {
        console.error("Ошибка при приеме сообщения через WS:", e);
    }

    // Системные сообщения (вход/выход)
    if (!ev.data.startsWith('{')) {
        const sysMsg = document.createElement('div');
        sysMsg.style.cssText = "text-align:center; color:#888; font-size: 0.9em; margin:10px 0; width:100%;";
        sysMsg.textContent = ev.data;
        const msgDiv = document.getElementById('messages');
        if (msgDiv) msgDiv.appendChild(sysMsg);
    }
};

    ws.addEventListener('close', () => {
        appendMessage('Соединение разорвано', 'system');
        showChatInfo('Соединение разорвано', 'error');
        ws = null;
    });

    ws.addEventListener('error', (e) => {
        console.error('WS error', e);
        showChatInfo('Ошибка WebSocket', 'error');
    });

// ИСПРАВЛЕННЫЙ ВЫХОД
if (logoutBtn) {

        if (displayNameEl) {
            displayNameEl.style.display = 'none';

        appendMessage('Выход из чата. Соединение разорвано', 'system'); 
        showOnlyAuth(); 
        
        if (usernameEl) usernameEl.value = '';
        if (passwordEl) passwordEl.value = '';
    }); 
}
}

async function sendMessage() { 
    const tokenValue = localStorage.getItem('accesstoken');
    
    // 1. Проверка соединения
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        showChatInfo('Сначала подключитесь к чату!', 'error');
        return;
    }

    // Определяем элементы (убедись, что ID совпадают с твоим HTML)
    const textEl = document.getElementById('text');
    const fileEl = document.getElementById('file');
    const fileNameEl = document.getElementById('file-name');
    const sendBtn = document.getElementById('send');
    const roomInput = document.getElementById('room');

    const room = roomInput ? (roomInput.value || '1') : '1';
    const text = textEl ? textEl.value.trim() : '';
    let file_url = null;

    function clearFileSelection() {
        if (fileEl) fileEl.value = '';
        if (fileNameEl) fileNameEl.textContent = '';
    }

    // 2. Логика загрузки файла (оставляем как была, она рабочая)
    if (fileEl && fileEl.files && fileEl.files.length > 0) {
        const fd = new FormData();
        fd.append('file', fileEl.files[0]); 
        fd.append('token', tokenValue);
    if (!tokenValue) {
      showChatInfo('Требуется авторизация (отсутствует токен)', 'error');
      clearFileSelection();
      return;
    }

        if (sendBtn) sendBtn.disabled = true;
        // showChatInfo('Загрузка файла...', 'info');

        try {
            const res = await fetch('/upload', {
                method: 'POST',
                body: fd
            });

        if (!res.ok) {
                const errorData = await res.json().catch(() => ({}));
                console.error("Детали ошибки от сервера:", errorData);
                throw new Error(errorData.detail || 'Ошибка сервера');
            }

            const parsed = await res.json();
            file_url = parsed.file_url || parsed.url || null;

        } catch (err) {
            console.error('Ошибка в fetch /upload:', err);
            showChatInfo('Ошибка при загрузке: ' + err.message, 'error');
            if (sendBtn) sendBtn.disabled = false;
            return; // Прекращаем отправку, если файл не загрузился
        } finally {
            if (sendBtn) sendBtn.disabled = false;
        }
    }

    // 3. Если нет ни текста, ни файла — выходим
    if (!text && !file_url) return;

    // 4. ОТПРАВКА В WEBSOCKET
    const payload = { 
        text: text, 
        file_url: file_url, 
        room: room 
    };

    try {
        // console.log('OUT WS payload', payload);
        ws.send(JSON.stringify(payload));
        if (textEl) textEl.value = ''; // Стираем текст в поле ввода
        if (fileEl) fileEl.value = '';  // Сбрасываем выбранный файл
        if (fileNameEl) fileNameEl.textContent = ''; // Стираем имя файла у скрепки
        
        // showChatInfo('Сообщение отправлено', 'success');

    } catch (err) {
        console.error('WS send error:', err);
        showChatInfo('Не удалось отправить сообщение', 'error');
        clearFileSelection();
    }
}

let mediaRecorder;
let audioChunks = [];

// --- ЗАПИСЬ ГОЛОСА ---
const voiceBtn = document.getElementById('voiceBtn');
voiceBtn.onclick = async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        voiceBtn.classList.remove('recording');
        return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        await uploadAndSendMedia(blob, 'voice.webm', 'voice');
        stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    voiceBtn.classList.add('recording');
};

// Функция загрузки записанного медиа (использует твою логику fetch /upload)
async function uploadAndSendMedia(blob, filename, type) {
    const tokenValue = localStorage.getItem('accesstoken');
    const fd = new FormData();
    fd.append('file', blob, filename);
    fd.append('token', tokenValue);

    try {
        const res = await fetch('/upload', { method: 'POST', body: fd });
        const parsed = await res.json();
        const file_url = parsed.file_url || parsed.url;
        
        const roomInput = document.getElementById('room');
        const room = roomInput ? (roomInput.value || '1') : '1';
        
        // ВАЖНО: Мы кладем тип сообщения в поле text!
        // Сервер это поле точно не удалит.
        ws.send(JSON.stringify({ 
            text: `__${type}__`, // Получится "__voice__" или "__video__"
            file_url: file_url, 
            room: room 
        }));
    } catch (err) {
        console.error("Ошибка загрузки медиа:", err);
    }
}

window.toggleAudio = function(btn) {
    // Находим аудио внутри того же родителя, где кнопка
    const audio = btn.parentElement.querySelector('audio');
    const fill = btn.parentElement.querySelector('.voice-progress-fill');
    const durLabel = btn.parentElement.querySelector('.duration');

    if (!audio) return;

    if (audio.paused) {
        // Останавливаем все остальные аудио в чате (как в Telegram)
        document.querySelectorAll('audio').forEach(a => { if(a !== audio) a.pause(); });

        const playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                btn.innerText = '⏸';
            }).catch(error => {
                console.log("Воспроизведение прервано:", error);
            });
        }

        audio.ontimeupdate = () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            if (fill) fill.style.width = progress + '%';
            
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            if (durLabel) durLabel.innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`;
        };
        audio.onended = () => { btn.innerText = '▶'; if(fill) fill.style.width = '0%'; };
    } else {
        audio.pause();
        btn.innerText = '▶';
    }
};

window.toggleVideo = function(container) {
    const video = container.querySelector('video');
    const circle = container.querySelector('.video-progress-circle');
    const totalLength = 628; 

    if (!video) return;

    if (video.paused) {
        // Останавливаем все остальные видео
        document.querySelectorAll('video').forEach(v => { if(v !== video) v.pause(); });

        const playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => { console.log("Видео прервано:", error); });
        }

        video.ontimeupdate = () => {
            const progress = video.currentTime / video.duration;
            const offset = totalLength - (progress * totalLength);
            if (circle) circle.style.strokeDashoffset = offset;
        };
        video.onended = () => { if (circle) circle.style.strokeDashoffset = totalLength; };
    } else {
        video.pause();
    }
};
